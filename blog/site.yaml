abo_text: "Neue Beiträge gibt es per RSS, einen Newsletter gibt es (noch) nicht."
ueber: |
  Dieser Blog ordnet ein, was sich für Menschen ändert, die mit KI arbeiten und coden: neue Modelle und ihre echten Kosten, Arbeitsweisen für Coding-Agents, Werkzeuge und Behauptungen aus der Szene.

  **So entstehen die Beiträge.** Ein KI-Assistent sammelt öffentlich zugängliche Quellen und schreibt daraus die Beiträge. Vor der Veröffentlichung prüfen automatische Regeln Quellen, Links und Zahlen. Was besteht, erscheint frühestens am Tag danach, damit Zeit zum Eingreifen bleibt. Die Quellen stehen unter jedem Beitrag.

  **Fehler.** Sie sind trotzdem möglich, vor allem bei Zahlen aus zweiter Hand. Korrekturen stehen im Beitrag mit dem Vermerk „aktualisiert“.

  **Kontakt und Verantwortlicher:** Philipp Asanger
