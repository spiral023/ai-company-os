ueber: |
  Dieser Blog ordnet ein, was sich für Menschen ändert, die mit KI arbeiten und coden: neue Modelle und ihre echten Kosten, Arbeitsweisen für Coding-Agents und Behauptungen aus der Szene, geprüft gegen ihre Quellen.

  **So entstehen die Beiträge.** Ein KI-Assistent sichtet und verdichtet öffentlich zugängliche Quellen, der Herausgeber prüft jeden Beitrag vor der Veröffentlichung. Jede Zahl trägt einen Quellenverweis. Wer sie gemessen hat, steht im Text: unabhängige Messung, Herstellerangabe, Selbstbericht oder eigene Rechnung.

  **So liest du die Urteile.** „Belegt“ heißt: Die Primärquelle oder eine unabhängige Messung stützt die Aussage. „Plausibel“ heißt: Sie passt zu bekannten Mustern, wurde aber nicht nachgeprüft. „Unbelegt“ heißt: Es liegt nur eine Behauptung vor.

