modelle_preise:
  titel: "Modelle und Preise"
  beschreibung: "Datierte Angaben zu Modellen, Preisen, Benchmarks und Markt rund um KI und Coding-Agents, mit Datum, Einschränkung und Quelle."
  pfad: "80_Knowledge/Fakten/Modelle-und-Preise.md"
  einleitung: "Jede Zeile sagt, wer was wann gemessen oder angekündigt hat. Die Seite wächst mit den Quellen, alte Angaben bleiben mit ihrem Datum stehen."
