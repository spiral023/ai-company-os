datenschutz: |
  **Verantwortlicher** ist Philipp Asanger, Kontakt siehe Impressum.

  **Hosting.** Diese Seite wird über Cloudflare, Inc. (USA) ausgeliefert. Beim Aufruf verarbeitet Cloudflare technisch notwendige Daten, darunter IP-Adresse, Zeitpunkt und aufgerufene Seite, um die Seite bereitzustellen und vor Missbrauch zu schützen. Rechtsgrundlage ist das berechtigte Interesse am sicheren Betrieb (Art. 6 Abs. 1 lit. f DSGVO). Cloudflare kann Daten auch außerhalb der EU verarbeiten. Näheres steht in der [Datenschutzerklärung von Cloudflare](https://www.cloudflare.com/privacypolicy/).

  **Cookies und Tracking.** Diese Seite setzt keine Cookies. Sie bindet keine Analyse-Werkzeuge, keine externen Schriften und keine fremden Skripte ein.

  **RSS-Feed.** Der Feed ist eine statische Datei. Wer ihn abruft, verursacht die unter „Hosting“ beschriebene Verarbeitung.

  **Deine Rechte.** Du hast das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung und Widerspruch. Anfragen richtest du an die Adresse im Impressum. Beschwerden kannst du bei der österreichischen [Datenschutzbehörde](https://www.dsb.gv.at) einreichen.
