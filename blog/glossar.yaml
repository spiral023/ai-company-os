# Glossar für ai-blog.sp23.online
#
# Der Generator erzeugt daraus die Seite /glossar/ und verlinkt in jedem Beitrag das
# erste Vorkommen eines Begriffs (auch seiner `aliase`) mit dem Glossar-Eintrag.
# Pluralformen (s, n, en, es) werden automatisch erkannt, Zusammensetzungen nicht.
#
# Felder je Eintrag:
#   begriff   Name im Glossar (Pflicht)
#   aliase    weitere Schreibweisen, die im Text verlinkt werden sollen
#   text      Erklärung in eigenen Worten, zwei bis vier Sätze (Pflicht). Der erste Satz
#             ist zugleich der Tooltip und muss für sich stehen.
#   siehe     Begriffe für „Siehe auch“
#
# Die Texte sind eigene Formulierungen. Die Begriffsauswahl orientiert sich am AI Coding
# Dictionary von Matt Pocock (ohne Lizenzangabe): Es werden keine Definitionen übernommen.

titel: "Glossar"
einleitung: "Fachbegriffe aus den Beiträgen, kurz und in eigenen Worten erklärt. Im Text ist jeweils die erste Nennung eines Begriffs mit seinem Eintrag verlinkt."
hinweis: "Die Begriffsauswahl orientiert sich am AI Coding Dictionary von Matt Pocock. Die Erklärungen sind eigene Texte und beschreiben allgemeines Verständnis, keine Messwerte."
hinweis_url: "https://www.aihero.dev/ai-coding-dictionary"

# Fachbegriffe, die in keinem Beitrag ohne Glossareintrag vorkommen dürfen.
# `--check` schlägt an, sobald einer im Fließtext steht, aber hier unten fehlt.
beobachten:
  - Rewind
  - Autocompact
  - Progressive Disclosure
  - Sycophancy
  - Vibe Coding
  - System Prompt
  - Stateless
  - Prefix Cache
  - Attention Budget
  - Human-in-the-loop
  - Review-Gate
  - Workload
  - Latenz
  - Monitoring
  - Diff
  - Closed Loop

begriffe:
  - begriff: Spec
    text: "Eine Spezifikation, die das gewünschte Verhalten einer Funktion und ihre Grenzen beschreibt. Sie hält fest, welche Fälle eine Umsetzung erfüllen muss und welche Wünsche außerhalb des Auftrags bleiben. Prüffähige Abnahmekriterien machen sie für Coding-Agents nutzbar."
    siehe: [Akzeptanzkriterium, Plan Mode]

  - begriff: Clef-Head
    text: "Der im Unsloth-Guide beschriebene Modellteil, der vorgegebene Antwortoptionen bewertet. Er ergänzt ein Sprachmodell für begrenzte Entscheidungsaufgaben. Die Qualität seiner Auswahl und Wahrscheinlichkeiten muss auf getrennten Daten geprüft werden."
    siehe: [Decision-Head, Kalibrierung]

  - begriff: Labelraum
    text: "Die Menge der erlaubten Antwortkategorien einer Klassifikationsaufgabe. Jede Kategorie braucht eine eindeutige Bedeutung und passende Beispiele. Mehrdeutige Kategorien erschweren sowohl das Training als auch die Bewertung."
    siehe: [Decision-Head]

  - begriff: Datenvertrag
    text: "Die vereinbarte Form und Bedeutung von Daten an einer Schnittstelle. Er beschreibt beispielsweise Pflichtfelder, erlaubte Werte und die Behandlung fehlender Angaben. Testdaten sollten zu diesem Vertrag passen oder ausdrücklich einen Fehlerfall prüfen."

  - begriff: Regressionstest
    text: "Eine wiederholbare Prüfung, die das erneute Auftreten eines bereits behobenen Fehlers erkennen soll. Sie verwendet den auslösenden Fall und ein klar erwartetes Ergebnis. Damit bleibt die Korrektur auch bei späteren Änderungen prüfbar."
    siehe: [Regression, Reproduktionsschritte]

  - begriff: Plan Mode
    text: "Ein Arbeitsmodus eines Coding-Agents, in dem er zunächst untersucht und einen Umsetzungsvorschlag vorbereitet. Welche Werkzeuge dabei erlaubt sind, hängt vom jeweiligen Produkt und seiner Konfiguration ab. Ein geprüfter Plan braucht klare Anforderungen und Abnahmekriterien."
    siehe: [Agent, Akzeptanzkriterium]

  - begriff: Grilling
    text: "Eine gezielte Fragerunde, mit der ein Agent Unklarheiten in einer Anforderung oder einem Entwurf aufdeckt. Dabei werden Erwartungen, Randfälle und Fachbegriffe geklärt, bevor die Umsetzung beginnt. Wie umfangreich die Runde sinnvoll ist, hängt vom Vorhaben ab."
    siehe: [Plan Mode, Spec]

  - begriff: Safe Area
    aliase: [Safe Areas]
    text: "Ein Bereich des Bildschirms, in dem Inhalte ohne Überdeckung durch Aussparungen oder Systembedienelemente dargestellt werden können. Eine randfüllende Webapp kann die zugehörigen Randabstände für wichtige Bedienelemente berücksichtigen. Diese Abstände ersetzen keine Prüfung mit geöffneter Bildschirmtastatur."
    siehe: [Viewport]

  - begriff: PWA
    aliase: [Progressive Web App]
    text: "Eine Webapp, die Browserfunktionen wie Installation oder Offline-Nutzung ergänzen kann. Welche Funktionen verfügbar sind, hängt von der Implementierung, dem Browser und der Plattform ab. Auch eine installierte PWA verwendet Webtechnologie."

  - begriff: Decision-Head
    aliase: [Decision-Head-Fine-Tuning]
    text: "Eine Ausgabeschicht eines Modells, die vorgegebene Entscheidungsoptionen bewertet. Sie wird zusammen mit einem bestehenden Sprachmodell oder Teilen davon für eine begrenzte Aufgabe trainiert. Die ausgegebenen Wahrscheinlichkeiten müssen auf eigenen Daten geprüft werden."
    siehe: [Fine-Tuning, Kalibrierung]

  - begriff: LoRA
    text: "Eine Methode zum Fine-Tuning, bei der zusätzliche kleine trainierbare Matrizen die Anpassung eines bestehenden Modells übernehmen. Viele ursprüngliche Modellparameter bleiben dabei unverändert. Ob sich die Anpassung lohnt, zeigt die Auswertung auf getrennten Testdaten."
    siehe: [Fine-Tuning, Holdout]

  - begriff: Accuracy
    aliase: [Genauigkeit]
    text: "Der Anteil der Antworten, die richtig sind. Bei Benchmarks sagt sie allein wenig: Ein Modell kann bei gleicher Accuracy deutlich öfter falsch liegen oder öfter passen, je nachdem, ob es bei Unsicherheit antwortet oder verzichtet."
    siehe: [Halluzination, Verweigerung]

  - begriff: Adversarial Agent
    aliase: [Adversarial Reviewer, Adversarial Review, Adversarial Reviews]
    text: "Ein zweiter Agent, der die Arbeit eines ersten gezielt kritisieren soll, statt sie zu bestätigen. Er bekommt idealerweise frischen Kontext ohne die Vorgeschichte des ersten, damit er dessen Annahmen nicht übernimmt und Lücken eher findet."
    siehe: [Agent, Pull Request]

  - begriff: Agent
    aliase: [Coding-Agent]
    text: "Ein Programm, in dem ein KI-Modell in einer Schleife selbst entscheidet, was als Nächstes zu tun ist: Es liest Dateien, ruft Werkzeuge auf, wertet die Ergebnisse aus und macht weiter, bis die Aufgabe erledigt ist oder es nachfragen muss. Ein Coding-Agent tut das mit Programmcode."
    siehe: [Harness, Tool Call]

  - begriff: AGENTS.md
    aliase: [CLAUDE.md]
    text: "Eine Textdatei im Projekt, die ein Coding-Agent bei jedem Start liest: Regeln, Konventionen, wichtige Befehle. Weil ihr Inhalt in jedem Turn mitgeschickt wird, kostet jede Zeile dauerhaft Tokens. Sie sollte deshalb kurz bleiben."
    siehe: [Harness, Token]

  - begriff: Artificial Analysis
    text: "Ein Drittanbieter, der Modelle mit eigenen Tests vergleicht und Ranglisten veröffentlicht. Seine Werte sind keine Herstellerangaben, gelten aber nur für den jeweils getesteten Aufbau."
    siehe: [Benchmark, Intelligence Index]

  - begriff: Autocompact
    aliase: [Autocompact-Puffer, Auto-Compact]
    text: "Die automatische Compaction, die ein Coding-Agent selbst auslöst, wenn das Context Window fast voll ist. Für sie wird ein Teil des Fensters freigehalten, nutzbar ist deshalb weniger als die angegebene Gesamtgröße. Wer früher und gezielt selbst verdichtet, bestimmt besser, was erhalten bleibt."
    siehe: [Compaction, Context Window]

  - begriff: Benchmark
    text: "Ein standardisierter Test mit festen Aufgaben und Bewertungsregeln, mit dem sich Modelle vergleichen lassen. Die Ergebnisse gelten nur für den getesteten Aufbau: Andere Prompts, Werkzeuge oder Versionen können abweichende Werte liefern."
    siehe: [Harness, Eval]

  - begriff: Blast Radius
    text: "Wie weit sich ein Fehler auswirkt, wenn er durchrutscht. Ein Tippfehler im Changelog betrifft fast nichts, eine Migration der Produktionsdatenbank alles. Je größer der Blast Radius und je schwerer eine Änderung rückgängig zu machen ist, desto genauer sollte ein Mensch hinsehen."
    siehe: [Pull Request]

  - begriff: Closed Weights
    text: "Das Modell läuft nur beim Anbieter, seine Parameter (die „Gewichte“) sind nicht veröffentlicht. Du kannst es nutzen, aber nicht selbst betreiben oder untersuchen."

  - begriff: Coding Agent Index
    text: "Ein Gesamtwert von Artificial Analysis für Coding-Agents, gemessen in einem konkreten Harness wie Claude Code. Er ist eine eigene Skala und lässt sich nicht mit dem Intelligence Index mischen."
    siehe: [Artificial Analysis, Intelligence Index, Harness]

  - begriff: Compaction
    aliase: [Kompaktion, Kompaktieren, Auto-Compaction]
    text: "Das Zusammenfassen eines langen Gesprächsverlaufs zu einer kürzeren Fassung, damit im Context Window wieder Platz ist. Das Modell entscheidet dabei selbst, was wichtig war, deshalb können Details verloren gehen. Was in einer Datei steht, überlebt die Verdichtung."
    siehe: [Context Window, Handoff]

  - begriff: Context Rot
    text: "Der Effekt, dass ein Modell schlechter arbeitet, je voller sein Context Window wird: Alte Fehlversuche, lange Tool-Ausgaben und verworfene Ideen lenken ab. Ab wann das spürbar wird, hängt von Modell und Aufgabe ab."
    siehe: [Context Window, Compaction]

  - begriff: Context Window
    aliase: [Kontextfenster]
    text: "Auch Kontextfenster genannt: die Textmenge (in Tokens), die ein Modell pro Anfrage auf einmal berücksichtigen kann. Dazu gehören Anweisungen, bisheriger Verlauf, gelesene Dateien und Tool-Ausgaben. Ein größeres Fenster verhindert nicht, dass die Qualität bei vollem Fenster nachlässt."
    siehe: [Token, Context Rot]

  - begriff: Effort
    aliase: [Effort-Stufe]
    text: "Eine Einstellung, wie viel Denkaufwand ein Modell in eine Antwort steckt, bei Claude von low bis max. Mehr Effort bedeutet meist mehr Tokens, mehr Zeit und höhere Kosten pro Aufgabe. Ob sich das lohnt, hängt von der Aufgabe ab."
    siehe: [Token]

  - begriff: Elo
    aliase: [Elo-Punkte]
    text: "Eine Punktzahl aus paarweisen Vergleichen, die ursprünglich aus dem Schach stammt. Wer mehr Punkte hat, gewinnt im direkten Vergleich häufiger. Erst der Abstand zwischen zwei Werten sagt etwas, der absolute Wert nicht."
    siehe: [Benchmark]

  - begriff: Eval
    aliase: [Eval-Case]
    text: "Ein wiederholbarer Test für das Verhalten eines KI-Systems: eine Aufgabe plus Regeln, wann das Ergebnis als gut gilt. So lässt sich messen, ob eine Änderung (anderes Modell, neuer Prompt, ein Plugin) wirklich etwas verbessert, statt sich nur besser anzufühlen."
    siehe: [Grader, Benchmark]

  - begriff: Fine-Tuning
    aliase: [Feintuning, feintunt, Feintunen]
    text: "Ein bestehendes Modell mit eigenen Beispielen nachtrainieren, damit es einen Stil oder eine enge Aufgabe besser trifft. Das kostet Zeit und Geld und muss bei einer neuen Modellgeneration oft wiederholt werden."

  - begriff: Grader
    aliase: [Judge, LLM-Judge]
    text: "Die Instanz, die in einem Eval das Ergebnis bewertet: entweder eine feste Regel (etwa ein Textmuster) oder ein zweites Modell, das als Judge urteilt. Judge-Modelle machen selbst Fehler. Fällt ein Ergebnis überraschend schlecht aus, lohnt zuerst der Blick auf den Judge."
    siehe: [Eval]

  - begriff: Halluzination
    aliase: [Halluzinationsrate]
    text: "Eine flüssig und selbstsicher formulierte Antwort, die falsch oder erfunden ist. Im Benchmark AA-Omniscience misst die Halluzinationsrate, wie oft ein Modell falsch antwortet, statt bei Nichtwissen zu verzichten. Sie sinkt deshalb auch dann, wenn ein Modell einfach öfter die Antwort verweigert."
    siehe: [Verweigerung, Accuracy]

  - begriff: Handoff
    aliase: [Handoff-Datei, Handoff-Dokument]
    text: "Eine Datei, die den Stand einer Arbeit für die nächste Session festhält: Ziel, Erledigtes, offene Punkte. Damit kannst du den Kontext leeren und trotzdem nahtlos weiterarbeiten."
    siehe: [Session, Compaction]

  - begriff: Harness
    aliase: [Agentic Harness]
    text: "Alles um das Modell herum, was es zum Agent macht: Werkzeuge, System Prompt, Rückfragen vor riskanten Aktionen, Hooks und die Verwaltung des Context Windows. Dasselbe Modell verhält sich in verschiedenen Harnesses unterschiedlich. Benchmark-Werte sind deshalb nur im jeweiligen Harness vergleichbar."
    siehe: [Agent, Hook, Benchmark]

  - begriff: Hook
    text: "Ein Skript, das ein Coding-Agent automatisch an festen Stellen ausführt, etwa vor einem Tool-Aufruf oder nach dem Speichern einer Datei. Anders als eine Anweisung in einer Textdatei führt das Harness Hooks verlässlich aus. Sie eignen sich deshalb für Pflichtregeln."
    siehe: [Harness, Skill]

  - begriff: Intelligence Index
    aliase: [Intelligence-Index]
    text: "Ein Gesamtwert von Artificial Analysis, der die Ergebnisse mehrerer Benchmarks zu einer Zahl verdichtet. Werte verschiedener Versionen (etwa v4.3) und verschiedener Indizes lassen sich nicht direkt vergleichen."
    siehe: [Artificial Analysis, Coding Agent Index]

  - begriff: Kalibrierung
    aliase: [Kalibrierungskurve, kalibriert]
    text: "Ein Modell ist kalibriert, wenn seine angegebene Sicherheit zur Trefferquote passt: Von den Antworten mit 80 Prozent Zuversicht stimmen etwa 80 Prozent. Die Kalibrierungskurve zeigt dieses Verhältnis. Sie sollte man auf eigenen Daten prüfen."

  - begriff: MCP
    aliase: [MCP-Server]
    text: "Das Model Context Protocol, ein offener Standard, über den ein Agent externe Werkzeuge und Datenquellen ansprechen kann, etwa einen Kalender, eine Datenbank oder einen Browser. Jeder angeschlossene MCP-Server belegt Platz im Context Window."
    siehe: [Tool Call, Context Window]

  - begriff: Model Routing
    aliase: [Routing]
    text: "Ein Vorschaltschritt, der pro Anfrage entscheidet, welches Modell sie bekommt: einfache Fragen an ein günstiges, schwierige an ein starkes."

  - begriff: MRCR
    text: "Ein Benchmark für langen Kontext: Das Modell soll bestimmte Stellen in einem sehr langen Gesprächsverlauf wiederfinden, der viele ähnliche Stellen enthält. Der Anteil der Treffer (Recall) sinkt bei vielen Modellen, wenn der Text länger wird."
    siehe: [Benchmark, Context Window]

  - begriff: Orchestrator
    text: "Ein Agent, der Aufgaben plant und an andere Agents verteilt, statt sie selbst zu erledigen. Er hält den Überblick, während die ausführenden Agents in getrennten Kontexten arbeiten."
    siehe: [Agent, Subagent]

  - begriff: Pareto-Front
    aliase: [Pareto Frontier, Kostenfront]
    text: "Die Menge der Optionen, die bei ihren Kosten nicht übertroffen werden: Kein anderes Modell ist gleichzeitig besser und billiger. Wer mehr Leistung will, muss mehr zahlen. Die Front gilt immer nur relativ zu den gemessenen Modellen."
    siehe: [Intelligence Index]

  - begriff: Permission Prompt
    text: "Die Rückfrage eines Agents, bevor er etwas Riskantes tut, etwa Dateien löschen oder einen Befehl ausführen. Sie bremst den Ablauf, ist aber die Stelle, an der du eingreifen kannst."
    siehe: [Harness, Sandbox]

  - begriff: Plugin
    text: "Ein Erweiterungspaket für ein Werkzeug wie Claude Code, das Skills, Befehle, Hooks oder MCP-Server bündelt und gemeinsam installierbar macht."
    siehe: [Skill, Hook, MCP]

  - begriff: Primärquelle
    text: "Das Original: die Seite des Herstellers, die Studie selbst, der Post des Urhebers. Wer eine Zahl nur aus einem Video oder einer Zusammenfassung kennt, liest eine Sekundärquelle, also eine Zwischenstufe, die Fehler enthalten kann."
    siehe: [Sekundärquelle]

  - begriff: Prompt Cache
    aliase: [Prompt-Caching, Prompt Caching, Cached Input, Cache Reads]
    text: "Der Anbieter merkt sich den unveränderten Anfang einer Anfrage und berechnet ihn beim nächsten Mal deutlich günstiger. Die Ersparnis verfällt nach einer Pause (siehe TTL) und geht verloren, wenn sich der Anfang des Verlaufs ändert."
    siehe: [TTL, Token]

  - begriff: Pull Request
    aliase: [PR, Merge Request]
    text: "Ein Änderungsvorschlag an einem Code-Projekt, den jemand prüft, bevor er übernommen wird (Merge). Coding-Agents liefern ihre Arbeit oft als Pull Request ab. So kann ein Mensch oder ein Review-Agent sie ansehen, bevor sie im Projekt landet."
    siehe: [Adversarial Agent, Required Status Checks]

  - begriff: Reranking
    text: "Ein zweiter Schritt, der eine bereits gefundene Trefferliste noch einmal nach Relevanz ordnet, meist mit einem besseren, aber teureren Verfahren als die erste Suche."

  - begriff: Required Status Checks
    text: "Eine GitHub-Einstellung, die einen Merge sperrt, solange festgelegte automatische Prüfungen (Tests, Linter) nicht bestanden sind. Sie gilt auch für Änderungen von Agents."
    siehe: [Pull Request]

  - begriff: Rewind
    text: "Ein Befehl, der eine Session an einen früheren Punkt zurücksetzt, im Fall von Claude Code je nach Auswahl Gespräch und Codeänderungen. Ein Fehlversuch verschwindet damit aus dem Kontext, statt ihn mit einer Korrekturnachricht weiter mitzuschleppen. Verloren geht auch, was der Agent auf dem Irrweg gelernt hat."
    siehe: [Session, Context Rot]

  - begriff: Sandbox
    text: "Eine abgeschottete Umgebung, in der ein Agent Code ausführen darf, ohne an dein restliches System oder deine Zugangsdaten zu kommen. Sie begrenzt den Schaden, wenn der Agent etwas Falsches tut."
    siehe: [Permission Prompt]

  - begriff: SDLC
    text: "Software Development Lifecycle, der Weg einer Software von Planung über Bauen und Testen bis zum Betrieb. In der Diskussion um Coding-Agents geht es darum, welche dieser Phasen ein Agent übernimmt und wo weiter ein Mensch entscheidet."

  - begriff: Sekundärquelle
    text: "Eine Darstellung, die eine andere Quelle wiedergibt oder auswertet: ein Artikel, ein Video, eine Zusammenfassung. Sie ist gut für den Einstieg. Zahlen daraus solltest du vor der Weitergabe im Original nachlesen."
    siehe: [Primärquelle]

  - begriff: Session
    text: "Ein zusammenhängender Arbeitsverlauf mit einem Agent samt seinem Kontext. Startest du eine neue Session, beginnt der Agent ohne das bisher Gelesene."
    siehe: [Handoff, Turn]

  - begriff: Shadow Mode
    text: "Ein neues System läuft parallel mit und trifft Entscheidungen, die aber nicht ausgeführt, sondern nur mit dem bisherigen Ergebnis verglichen werden. So siehst du auf echten Daten, ob es taugt, bevor es etwas auslöst."

  - begriff: Skill
    text: "Eine Anleitung als Markdown-Datei, gegebenenfalls mit Skripten, die ein Agent bei passender Aufgabe lädt, etwa „so schreibst du unseren Release-Text“. Sie macht Wissen wiederverwendbar, ohne dass es dauerhaft im Kontext liegen muss."
    siehe: [Hook, Plugin]

  - begriff: Subagent
    text: "Ein Hilfs-Agent mit eigenem, frischem Context Window, den der Haupt-Agent für eine Teilaufgabe startet und der nur sein Ergebnis zurückmeldet. So bleibt langer Zwischenoutput aus dem Hauptverlauf. Jeder Aufruf kostet allerdings eigene Tokens."
    siehe: [Agent, Orchestrator]

  - begriff: Terminal-Bench
    text: "Ein Benchmark, bei dem Agents Aufgaben in einer Kommandozeilen-Umgebung lösen müssen, etwa Programme bauen oder Systeme einrichten. Die Werte hängen vom verwendeten Harness ab."
    siehe: [Benchmark, Harness]

  - begriff: Token
    text: "Die Recheneinheit, in der Modelle Text zählen: ein Wortstück, im Deutschen oft kürzer als ein Wort. Abgerechnet wird pro Million Input-Tokens (was du sendest) und Output-Tokens (was das Modell erzeugt). Der Preis pro Token sagt noch nichts über die Kosten pro Aufgabe."
    siehe: [Context Window, Prompt Cache]

  - begriff: Tool Call
    aliase: [Tool-Call, Tool-Aufruf]
    text: "Die Anfrage des Modells, ein Werkzeug zu nutzen: eine Datei lesen, einen Befehl ausführen, im Web suchen. Das Harness führt sie aus und gibt das Ergebnis ans Modell zurück."
    siehe: [Harness, MCP]

  - begriff: TTL
    text: "Time to Live, also wie lange etwas gespeichert bleibt. Beim Prompt Cache ist das die Zeit, nach der der günstige Zwischenspeicher verfällt. Danach wird der Anfang der Anfrage wieder zum vollen Preis berechnet. Die Zeiten unterscheiden sich je Anbieter."
    siehe: [Prompt Cache]

  - begriff: Turn
    text: "Ein Durchgang im Gespräch mit einem Agent: Du schickst eine Nachricht, der Agent antwortet, gegebenenfalls nach vielen Tool Calls. Bei jedem Turn liest das Modell den gesamten bisherigen Verlauf erneut."
    siehe: [Session, Tool Call]

  - begriff: Verweigerung
    aliase: [verweigern, Verweigern]
    text: "Das Modell beantwortet eine Frage nicht, statt zu raten. Das senkt die Halluzinationsrate, ohne dass das Modell mehr weiß. Ob dir das nützt, hängt davon ab, ob in deinem Einsatz eine falsche Antwort teurer ist als keine."
    siehe: [Halluzination, Accuracy]

  - begriff: Worktree
    aliase: [Worktree-Isolation]
    text: "Ein zweites Arbeitsverzeichnis desselben Git-Repositorys auf einem eigenen Branch. Damit können mehrere Agents parallel am selben Projekt arbeiten, ohne sich gegenseitig die Dateien zu überschreiben."
    siehe: [Agent, Orchestrator]

  - begriff: Diff
    aliase: [Diffs]
    text: "Die Gegenüberstellung von altem und neuem Stand einer Datei, die zeigt, welche Zeilen hinzugekommen, entfallen oder geändert sind. Ein Review liest in der Regel den Diff, nicht den ganzen Code."
    siehe: [Pull Request]

  - begriff: Gate
    aliase: [Review-Gate, Gates, CI-Gate]
    text: "Eine Kontrollstelle, an der eine Änderung stehen bleibt, bis eine Bedingung erfüllt ist: ein bestandener Test, eine Kostenschwelle oder die Freigabe einer Person. Ein Gate ist mehr als ein Hinweis, weil es den Weiter-Schritt tatsächlich sperrt."
    siehe: [Required Status Checks, Pull Request]

  - begriff: Latenz
    text: "Die Zeit zwischen Anfrage und Antwort. Bei Modellen zählt meist die Wartezeit bis zum ersten Token und die Zeit bis zur vollständigen Antwort. Ein günstigeres oder klügeres Modell kann dabei spürbar langsamer sein."
    siehe: [Token]

  - begriff: Closed Loop
    aliase: [Schleife]
    text: "Ein Kreislauf, in dem das Ergebnis einer Handlung als Rückmeldung wieder in den Ausgangspunkt fließt. Im Agenten-Kontext: Der Agent baut, beobachtet die Wirkung, zum Beispiel über Telemetrie aus der Produktion, und korrigiert sich, ohne dass ein Mensch dazwischen steht."
    siehe: [Agent, Gate]

  - begriff: Monitoring
    text: "Die laufende Beobachtung eines Systems im Betrieb, etwa über Fehlerraten, Antwortzeiten und Logs. Es erkennt Probleme erst, nachdem der Code läuft, und ersetzt deshalb keine Prüfung vor dem Merge."
    siehe: [Closed Loop]

  - begriff: Output
    aliase: [Outputs, Output-Token]
    text: "Der Text, den das Modell erzeugt, im Unterschied zum Input, den es liest. Output-Token sind bei den meisten Anbietern deutlich teurer als Input-Token, und Modelle mit langem Nachdenken erzeugen viele davon."
    siehe: [Token, Effort]

  - begriff: Score
    aliase: [Scores]
    text: "Die Kennzahl, die ein Benchmark für ein Modell ausgibt, meist als Prozentwert oder Punktzahl. Ein Score gilt nur für genau diese Testaufgaben und Testbedingungen. Was er für deine Aufgaben bedeutet, zeigt erst eine eigene Messung."
    siehe: [Benchmark, Eval]

  - begriff: Task
    aliase: [Tasks]
    text: "Eine einzelne Aufgabe, die ein Agent oder ein Benchmark bearbeitet, zum Beispiel einen Fehler beheben oder eine Funktion ergänzen. Kosten pro Task sind oft aussagekräftiger als der Preis pro Token, weil sie den Verbrauch mitrechnen."
    siehe: [Benchmark, Token]

  - begriff: Workload
    text: "Die Gesamtheit der Aufgaben, die du tatsächlich an ein Modell stellst, also Art, Länge und Menge. Benchmarks messen einen fremden Workload. Kosten und Qualität für deinen eigenen kennst du erst nach einem Test damit."
    siehe: [Benchmark, Task]

  - begriff: Hillclimbing
    aliase: [Hill Climbing]
    text: "Ein System in kleinen Schritten gegen einen festen Score verbessern: pro Runde eine Änderung, neu messen, behalten nur, was hilft. Das trägt, solange der Score misst, worauf es dir ankommt, und ein getrennter Testteil prüft, ob die Verbesserung auch auf neuen Fällen hält."
    siehe: [Eval, Holdout, Overfitting]

  - begriff: Holdout
    aliase: [Holdout-Set, Test-Split]
    text: "Der Teil deiner Testfälle, den der Optimierer nie zu sehen bekommt. Daran misst du, ob eine Verbesserung auf unbekannten Fällen trägt. Steigt nur der Score auf den gesehenen Fällen, hast du wahrscheinlich auf genau diese Fälle hin optimiert."
    siehe: [Eval, Overfitting]

  - begriff: Overfitting
    text: "Ein System passt sich so eng an seine Testfälle an, dass es dort glänzt, im echten Einsatz aber nicht besser wird. Bei Prompts und Skills passiert das schnell, etwa wenn Fehlerbeispiele direkt in den Prompt wandern. Ein getrennter Testteil macht es sichtbar."
    siehe: [Holdout, Eval]

  - begriff: Logits
    text: "Die Rohwerte, die ein Sprachmodell für jedes mögliche nächste Token ausgibt. Ein höherer Wert heißt, das Token passt besser zum bisherigen Text. Wahrscheinlichkeiten werden daraus erst durch Softmax."
    siehe: [Token, Softmax]

  - begriff: Softmax
    text: "Ein Rechenschritt, der Rohwerte in Wahrscheinlichkeiten umwandelt, die zusammen eins ergeben. Rechnet man ihn nur über eine kleine Auswahl, etwa feste Antwortoptionen, verteilt sich die ganze Wahrscheinlichkeit auf genau diese. Deshalb braucht eine solche Auswahl eine Ausweichoption."
    siehe: [Logits, Kalibrierung]

  - begriff: Structured Output
    aliase: [Structured Outputs]
    text: "Eine Funktion von Modell-APIs, die die Antwort in ein vorgegebenes Format zwingt, meist ein JSON-Objekt mit festen Feldern. Das Format ist damit gesichert, der Inhalt der Felder nicht. Das Modell erzeugt die Antwort weiterhin Token für Token."
    siehe: [Token]

  - begriff: Prefill
    text: "Der erste Rechendurchlauf, in dem ein Modell den ganzen Prompt auf einmal verarbeitet, bevor es mit dem Schreiben beginnt. Beim Auswerten fester Antwortoptionen bleibt es bei diesem einen Durchlauf, deshalb ist das deutlich schneller als eine Textantwort."
    siehe: [Token, Logits]

  - begriff: Tokenizer
    text: "Das Bauteil, das Text in die Tokens zerlegt, mit denen ein Modell arbeitet. Jedes Modell hat seinen eigenen, deshalb kann derselbe Text unterschiedlich viele Tokens ergeben. Schon ein führendes Leerzeichen kann aus einem Zeichen ein anderes Token machen."
    siehe: [Token]

  - begriff: Prompt Injection
    text: "Anweisungen, die in einem Text versteckt sind, den ein Modell liest, etwa auf einer Webseite, in einem Dokument oder einer Nutzereingabe. Das Modell befolgt sie, als kämen sie von dir. Gefährlich wird das, sobald das Modell Werkzeuge aufrufen oder Daten verändern darf."
    siehe: [Agent, Tool Call]

  - begriff: Row Level Security
    aliase: [RLS]
    text: "Eine Datenbankregel, die pro Zeile festlegt, wer sie lesen oder ändern darf. Weil sie in der Datenbank selbst greift, schützt sie auch dann, wenn die App einen Fehler hat. Ohne sie sieht jeder, der die Tabelle erreicht, alle Zeilen."

  - begriff: CORS
    text: "Eine Browserregel, die festlegt, welche fremden Webseiten Anfragen an deine Schnittstelle schicken und die Antwort lesen dürfen. Ist sie zu offen eingestellt, kann fremder Code im Namen deiner Nutzer auf deren Daten zugreifen."

  - begriff: CSRF
    text: "Ein Angriff, bei dem eine fremde Seite den Browser eines angemeldeten Nutzers dazu bringt, bei deiner App ungewollt etwas auszulösen, etwa eine Bestellung oder eine Passwortänderung. Schutz bieten Prüfwerte pro Formular und passend eingestellte Cookies."

  - begriff: XSS
    aliase: [Cross-Site Scripting]
    text: "Fremder Code, der über Eingaben wie Kommentare, Markdown oder hochgeladene Bilder in deine Seite gelangt und im Browser anderer Nutzer ausgeführt wird. Er kann dort Sitzungen auslesen oder Aktionen auslösen. Abhilfe ist, Eingaben vor der Anzeige zu bereinigen."

  - begriff: Rate Limit
    aliase: [Rate Limits, Rate Limiting]
    text: "Eine Obergrenze, wie oft ein Nutzer oder eine Adresse eine Funktion in einem Zeitraum aufrufen darf. Sie bremst Passwort-Raten und Spam und verhindert, dass jemand über deine KI-Funktionen hohe Kosten verursacht."

  - begriff: Webhook
    aliase: [Webhooks]
    text: "Eine Nachricht, die ein fremdes System an deine App schickt, sobald dort etwas passiert ist, etwa eine Zahlung. Weil sie doppelt ankommen oder gefälscht sein kann, sollte deine App die Signatur prüfen und Wiederholungen erkennen."

  - begriff: Mod
    aliase: [Mods, Claude Mods]
    text: "Eine Erweiterung für Claude Code, die tiefer eingreift als ein normales Plugin: Sie darf das Verhalten der Anwendung selbst verändern, etwa wie Regeln geladen oder Ansichten geöffnet werden. Einige Mods sind fest eingebaut. Weil sie so tief eingreifen, legen Organisationen oft fest, welche Mods erlaubt sind."
    siehe: [Plugin, Skill]

  - begriff: HyperFrames
    aliase: [Hyperframes]
    text: "Ein quelloffenes Werkzeug von HeyGen, das Videos als Code beschreibt: Eine animierte Webseite wird Bild für Bild aufgenommen und zu einem Video zusammengesetzt. Jede Farbe und jedes Timing bleibt dadurch als Code änderbar, statt dass das ganze Video neu erzeugt werden muss."

  - begriff: Trigger
    aliase: [Auslöser, Skill-Trigger]
    text: "Die Bedingung, unter der ein Agent einen Skill lädt, meist in dessen Beschreibung formuliert. Je enger der Trigger gefasst ist, desto seltener landet ein Skill im Kontext, der für die Aufgabe nichts beiträgt."
    siehe: [Skill, Router]

  - begriff: Router
    aliase: [Skill-Router]
    text: "Eine kurze Einstiegsdatei, die selbst wenig Inhalt hat und je nach Fall auf das passende Unterdokument oder Skript verweist. Der Agent liest so nur das, was er für den aktuellen Schritt braucht, und der Kontext bleibt klein."
    siehe: [Skill, Trigger]

  - begriff: Fixture
    aliase: [Fixtures, Wegwerf-Fixtures]
    text: "Vorbereitete Testdaten oder ein Testzustand, den ein Test vor dem Lauf aufbaut und danach wieder verwirft. Weil Fixtures keine echten Daten berühren, kann ein Agent Tests damit gefahrlos wiederholen."
    siehe: [Sandbox]

  - begriff: Reasoning-Token
    aliase: [Reasoning-Tokens]
    text: "Tokens, die ein Modell für sein internes Nachdenken erzeugt, bevor es antwortet. Sie erscheinen meist nicht in der Antwort, werden aber wie Output berechnet und treiben so die Kosten einer Aufgabe."
    siehe: [Token, Effort]

  - begriff: Stop-Bedingung
    aliase: [Stop-Kriterium, Abnahmebedingung]
    text: "Ein prüfbares Kriterium, an dem ein Agent erkennt, dass seine Aufgabe erledigt ist. Ohne sie hört er zu früh auf oder arbeitet weiter, obwohl das Ziel erreicht ist."
    siehe: [Agent, Task]

  - begriff: Viewport
    aliase: [Viewports]
    text: "Der sichtbare Bereich einer Webseite im Browserfenster oder auf dem Bildschirm eines Geräts. Ein mobiler Viewport ist schmal und hoch, deshalb ordnen sich Inhalte dort anders an als am Desktop. Wer eine Seite nur in einem Viewport prüft, übersieht Fehler, die erst auf anderen Bildschirmgrößen auftreten."
    siehe: [Komponentenbibliothek]

  - begriff: Komponentenbibliothek
    aliase: [Komponentenbibliotheken]
    text: "Eine Sammlung fertiger Bausteine für Oberflächen wie Buttons, Karten, Navigationsleisten oder Preistabellen. Sie kann ein Web-Katalog, ein Open-Source-Repo oder ein Ordner im eigenen Projekt sein. Ein Agent, der aus ihr auswählt, baut konsistenter als einer, der jedes Element neu erfindet."
    siehe: [Skill]

  - begriff: Reproduktionsschritte
    aliase: [Repro-Schritte, Reproduktionsschritten]
    text: "Die genaue Abfolge von Aktionen, mit der sich ein Fehler zuverlässig wieder auslösen lässt, etwa welche Seite, welche Eingabe, welcher Klick. Sie machen aus einem vagen Eindruck einen prüfbaren Befund. Wer einen Fehler behebt, nutzt dieselben Schritte danach als Test, ob er behoben ist."
    siehe: [Viewport]

  - begriff: Referenzbild
    aliase: [Referenzbilder, Mockup, Mockups]
    text: "Ein Bild, das zeigt, wie eine Oberfläche aussehen soll, bevor sie gebaut wird. Es ersetzt lange Beschreibungen von Layout, Farben und Abständen und dient dem Agenten als Vorlage. Ob das Ergebnis der Vorlage entspricht, muss man danach im Browser prüfen."
    siehe: [Viewport]

  - begriff: Ralph Loop
    aliase: [Ralph-Loop, Ralph Loops]
    text: "Ein Skript, das einen Coding-Agent immer wieder neu startet, jedes Mal mit leerem Kontext und derselben Grundanweisung. Was erledigt ist und was noch fehlt, steht in Dateien und Git-Commits, nicht im Gedächtnis des Modells. So kann ein Agent lange Aufgabenlisten abarbeiten, ohne dass sich Fehlversuche im Kontext ansammeln."
    siehe: [Agent, Context Rot, Handoff]

  - begriff: TDD
    aliase: [Test-Driven Development, testgetriebene Entwicklung]
    text: "Eine Arbeitsweise, bei der zuerst ein Test entsteht, der fehlschlägt, und erst danach der Code, der ihn bestehen lässt. Für Agents ist das ein klares Signal, ob ein Schritt fertig ist. Ein Test, der nie rot war, beweist allerdings nicht, dass er die gewünschte Logik prüft."
    siehe: [Agent, Reward Hacking]

  - begriff: Reward Hacking
    text: "Ein Agent erfüllt das gemessene Ziel auf einem Weg, den niemand gemeint hat. Typisch ist, Tests zu löschen oder abzuschwächen, damit „alle Tests grün“ stimmt. Dagegen helfen ein Prüfer, der nicht selbst gebaut hat, und Prüffälle, die der bauende Agent nicht kennt."
    siehe: [Eval, Overfitting, TDD]

  - begriff: Akzeptanzkriterium
    aliase: [Akzeptanzkriterien]
    text: "Eine vorab festgelegte, prüfbare Bedingung, die eine Funktion erfüllen muss, damit sie als fertig gilt. Oft wird sie als Satz nach dem Muster „Angenommen …, wenn …, dann …“ formuliert. Für einen Agent liefert sie ein Ziel, das sich mit Ja oder Nein beantworten lässt."
    siehe: [TDD, Gate]

  - begriff: Iterationslimit
    aliase: [Iterationslimits]
    text: "Die Höchstzahl an Durchläufen, die ein Agent-Loop machen darf, bevor er abbricht. Es begrenzt Kosten und verhindert, dass ein Agent endlos an einem Ziel dreht, das er nicht erreicht. Ein Lauf, der am Limit endet, braucht einen Blick von dir."
    siehe: [Ralph Loop, Closed Loop]

  - begriff: Regression
    aliase: [Regressionen]
    text: "Ein Fehler, der durch eine neue Änderung in etwas entsteht, das vorher schon funktioniert hat. Bestehende Tests sollen solche Rückschritte auffangen. Bei autonomen Agent-Läufen fallen sie oft erst spät auf, wenn niemand die einzelnen Änderungen liest."
    siehe: [TDD, Diff]

  - begriff: Micro-VM
    aliase: [Micro-VMs]
    text: "Eine sehr schlanke virtuelle Maschine, die schnell startet und ein Programm vom restlichen Rechner abschottet. Ein Agent, der darin läuft, kann Befehle ausführen, ohne das eigentliche System zu verändern. Das macht lange Läufe ohne Rückfragen sicherer."
    siehe: [Sandbox, Permission Prompt]

  - begriff: System Prompt
    aliase: [Systemprompt, System Prompts]
    text: "Die Grundanweisung, die ein Modell vor jeder Unterhaltung bekommt, noch vor deiner ersten Nachricht. Coding-Agents packen dort Regeln, Werkzeugbeschreibungen und Projektdateien wie AGENTS.md hinein. Alles darin nimmt bei jeder Anfrage Platz im Context Window ein, deshalb kostet ein langer System Prompt bei jedem Schritt."
    siehe: [Context Window, Token]

  - begriff: Progressive Disclosure
    aliase: [gestaffeltes Laden]
    text: "Ein Aufbau, bei dem ein Agent zuerst nur eine kurze Übersicht sieht und Details erst lädt, wenn er sie braucht. Bei Skills liegt dauerhaft nur Name und Beschreibung im Kontext, der eigentliche Inhalt und weitere Dateien folgen bei Bedarf. So bleibt der Kontext klein, obwohl viel Wissen verfügbar ist."
    siehe: [Skill, Context Window]

  - begriff: Deny-Rule
    aliase: [Deny-Rules, Deny-Regel, Deny-Regeln, Deny-Liste]
    text: "Ein Eintrag in den Einstellungen eines Coding-Agents, der einen Zugriff technisch verbietet, etwa das Lesen einer Datei oder einen bestimmten Befehl. Das Harness prüft die Regel, bevor das Werkzeug läuft, das Modell kann sie also nicht übergehen. Eine Anweisung in einer Textdatei wie AGENTS.md ist dagegen nur eine Bitte."
    siehe: [Harness, Hook, Permission Prompt]

  - begriff: Secret
    aliase: [Secrets]
    text: "Eine geheime Zugangsangabe wie ein API-Key, ein Passwort, ein privater Schlüssel oder ein Datenbank-Zugang. Secrets liegen oft in Dateien wie .env und dürfen weder ins Repository noch in den Kontext eines Agents gelangen. Was einmal im Kontext stand, kann in Antworten, Logs oder Commits wieder auftauchen."
    siehe: [Context Window, Deny-Rule]

  - begriff: Auto Mode
    text: "Ein Betriebsmodus von Claude Code, in dem ein eigenes Prüfmodell jeden Befehl bewertet und nur blockiert, was riskant wirkt. Du musst dann nicht jeden Schritt bestätigen. Weil ein Modell sich irren kann, ersetzt er keine fest eingetragenen Sperren."
    siehe: [Permission Prompt, Deny-Rule]

  - begriff: YOLO-Modus
    aliase: [YOLO]
    text: "Umgangssprachlich für einen Agent-Lauf ohne Rückfragen, bei dem alle Aktionen automatisch erlaubt sind. Das macht lange, unbeaufsichtigte Läufe möglich, erhöht aber den möglichen Schaden durch einen falschen Befehl. Vertretbar ist er nur in einer abgeschotteten Umgebung ohne echte Zugangsdaten."
    siehe: [Sandbox, Permission Prompt, Blast Radius]

  - begriff: Pre-Commit-Hook
    text: "Ein Skript, das Git vor jedem Commit ausführt und den Commit abbrechen kann. Typische Aufgaben sind Formatierung, Tests oder die Suche nach versehentlich eingefügten Zugangsdaten. Anders als ein Hook im Agent greift er unabhängig davon, wer den Commit auslöst."
    siehe: [Hook, Secret]

  - begriff: Tree-sitter
    text: "Ein Werkzeug, das Quellcode und Shell-Befehle in ihre Bestandteile zerlegt, statt sie als bloßen Text zu behandeln. Sicherheitsfilter nutzen das, um verkettete Befehle einzeln zu prüfen. So fällt ein gefährlicher Teil auch dann auf, wenn er hinter einem harmlosen Befehl versteckt ist."
    siehe: [Deny-Rule]

  - begriff: Baseline
    aliase: [Baseline-Vergleich]
    text: "Der Vergleichslauf ohne die Änderung, die du prüfen willst, etwa dieselbe Aufgabe einmal ohne Skill. Erst der Abstand zur Baseline zeigt, ob ein Skill oder Prompt etwas verbessert oder nur Tokens kostet."
    siehe: [Eval, Skill]

  - begriff: Frontmatter
    text: "Ein Block mit Metadaten im YAML-Format ganz oben in einer Markdown-Datei, eingerahmt von drei Bindestrichen. Bei Skills stehen dort Name, Beschreibung und Schalter, die steuern, wer den Skill auslösen darf und wie er läuft."
    siehe: [Skill, Trigger]

  - begriff: Fork
    aliase: [Forks]
    text: "Eine abgezweigte Ausführung in einem eigenen, frischen Kontext. Ein Skill im Fork läuft wie ein Subagent, sieht den bisherigen Gesprächsverlauf nicht und gibt nur sein Ergebnis zurück."
    siehe: [Subagent, Context Window]

  - begriff: Slash-Command
    aliase: [Slash-Commands, Slash Command]
    text: "Ein Befehl mit vorangestelltem Schrägstrich, den du im Chat eines Coding-Agents tippst, etwa /release. Der Agent führt dann einen hinterlegten Prompt oder Ablauf aus. Anders als bei einem Skill entscheidest du selbst, wann er startet."
    siehe: [Skill, Trigger]

  - begriff: Exit-Code
    aliase: [Exit-Codes]
    text: "Die Zahl, mit der sich ein Programm beim Beenden zurückmeldet. Null bedeutet üblicherweise Erfolg, jeder andere Wert einen Fehler oder einen bestimmten Zustand. Hooks und CI-Systeme lesen diesen Wert, um einen Schritt durchzulassen oder zu sperren."
    siehe: [Hook, Gate]

  - begriff: Matcher
    text: "Ein Filter in der Hook-Konfiguration, der festlegt, bei welchen Tools ein Hook feuert. Ohne ihn läuft der Hook bei jedem Tool-Aufruf, mit ihm etwa nur beim Bearbeiten oder Schreiben von Dateien."
    siehe: [Hook, Tool Call]

  - begriff: Gateway
    aliase: [MCP-Gateway, Gateways]
    text: "Eine Zwischenstation, die mehrere Dienste hinter einem gemeinsamen Zugang bündelt. Bei MCP sitzt ein Gateway vor vielen Servern, sodass der Agent nur noch einen Anschluss sieht. Dafür liegen dort auch die Zugangsdaten aller angeschlossenen Dienste."
    siehe: [MCP, Code Mode]

  - begriff: Code Mode
    aliase: [Code-Mode]
    text: "Ein Ansatz, bei dem ein Agent externe Werkzeuge nicht einzeln aufruft, sondern ein kurzes Skript schreibt, das sie in einer Sandbox nacheinander anspricht. Das Skript kann Ergebnisse filtern, bevor sie im Context Window landen. Der Preis sind Sandbox, ein zusätzlicher Suchschritt und mögliche Fehler im generierten Code."
    siehe: [MCP, Sandbox, Context Window]

  - begriff: Tool Search
    text: "Eine Funktion in Claude Code, die Beschreibungen von MCP-Tools erst dann in den Kontext lädt, wenn sie gebraucht werden. Ohne sie liegen alle Tool-Beschreibungen in jedem Turn im Context Window."
    siehe: [MCP, Progressive Disclosure]

  - begriff: Retrospektive
    aliase: [Retro, Retros]
    text: "Ein Rückblick nach abgeschlossener Arbeit: Was lief gut, was ging schief, was ändern wir beim nächsten Mal? Bei Agents wertet eine Retro meist eine oder mehrere Sessions aus und schlägt Änderungen an Regeln, Checks oder Skills vor. Ihr Wert hängt daran, ob jemand die Vorschläge umsetzt."
    siehe: [Session, Skill]

  - begriff: Linter
    aliase: [Linter-Regel, Linting]
    text: "Ein Programm, das Code ohne Ausführung auf Stil- und Fehlermuster prüft, etwa ungenutzte Variablen oder verbotene Importe. Eigene Regeln lassen sich ergänzen. Weil er bei jedem Lauf gleich entscheidet, eignet er sich für Vorgaben, an die sich ein Agent zuverlässig halten muss."
    siehe: [Pre-Commit-Hook, CI]

  - begriff: CI
    aliase: [Continuous Integration, CI-Job, CI-Jobs]
    text: "Continuous Integration: Ein Server führt bei jedem Push oder Pull Request automatisch Tests, Linter und Builds aus. Schlägt ein Schritt fehl, sieht das jeder im Pull Request, und ein Merge lässt sich sperren."
    siehe: [Pull Request, Required Status Checks, Linter]

  - begriff: Codepfad
    text: "Die Folge von Aufrufen und Entscheidungen, die ein Programm für einen bestimmten Ablauf durchläuft. Beim Nachvollziehen verfolgst du beispielsweise eine Eingabe vom Formular bis zur Speicherung und zur angezeigten Antwort."

  - begriff: API
    text: "Eine definierte Schnittstelle, über die Software Daten oder Funktionen bereitstellt. Bei einer Web-API beschreibt sie unter anderem erlaubte Anfragen, Antworten und Fehler."

  - begriff: Persistenz
    text: "Das dauerhafte Speichern eines Zustands über die aktuelle Programmausführung hinaus. Eine erfolgreiche Anzeige im Browser bestätigt für sich noch keine erfolgreiche Speicherung in der Datenbank."

  - begriff: Cache
    text: "Ein Zwischenspeicher für Daten oder Ergebnisse, die erneut gebraucht werden. Ein gespeicherter Wert kann veraltet sein; deshalb gehört zur Nutzung auch eine Regel für seine Aktualisierung."

  - begriff: Refactoring
    aliase: [Refactor, Refaktorierung]
    text: "Das Überarbeiten der inneren Struktur von Code bei gleichbleibendem vereinbartem Verhalten. Eine fachliche Verhaltensänderung braucht eine eigene Anforderung und Prüfung."

  - begriff: CSV
    text: "Ein Textformat für tabellarische Daten mit getrennten Feldern und Zeilen. Trennzeichen, Anführungszeichen und Zeilenumbrüche müssen beim Import und Export passend behandelt werden."

  - begriff: Branch
    text: "Ein benannter Entwicklungszweig in Git, dessen Verweis beim Committen weiterwandert. Getrennte Branches erlauben unterschiedliche Änderungsfolgen, die später integriert werden können."
    siehe: [Commit, Worktree]

  - begriff: Commit
    text: "Ein gespeicherter Entwicklungsstand mit Beschreibung und Verweis auf seine Vorgänger in Git. Änderungen in lokalen Dateien gehören erst nach dem Commit zu diesem Stand."
    siehe: [Branch, Diff]

  - begriff: HEAD
    text: "Der Git-Verweis auf den aktuell ausgecheckten Entwicklungsstand. Üblicherweise verweist er auf einen Branch, kann aber auch direkt auf einen Commit zeigen."
    siehe: [Branch, Commit, Worktree]

  - begriff: Lockdatei
    aliase: [Lockfile]
    text: "Eine Datei, die konkret aufgelöste Abhängigkeitsversionen festhält. Sie hilft, eine Installation nachzuvollziehen; Änderungen können mehrere Projektbereiche betreffen."

  - begriff: Mock
    aliase: [Mocktest, Mock-Test]
    text: "Ein Testobjekt, das eine Abhängigkeit ersetzt und vorbereitete Antworten oder beobachtbare Aufrufe liefert. Die ersetzte Logik wird dadurch nicht automatisch mitgeprüft."
    siehe: [Fixture, TDD]

  - begriff: Mutation
    aliase: [Mutationstest, Mutation Testing]
    text: "Eine gezielte falsche Änderung am Code, mit der du die Aussagekraft eines Tests prüfen kannst. Erkennt der Test sie nicht, fehlt möglicherweise ein relevantes Prüfkriterium oder der betroffene Code wird nicht erreicht."
    siehe: [TDD, Mock]

  - begriff: Revision
    text: "Ein bestimmter gespeicherter Versionsstand eines Projekts. Für eine nachvollziehbare Prüfung gehören zusätzlich vorhandene, noch nicht gespeicherte Dateiänderungen zum beschriebenen Arbeitsstand."
    siehe: [Commit, Diff]

  - begriff: List Comprehension
    text: "Eine kompakte Python-Schreibweise, um aus einem iterierbaren Wert eine neue Liste zu erzeugen. Sie kann Elemente umformen und mit einer Bedingung auswählen."

  - begriff: CLI
    aliase: [Command Line Interface]
    text: "Eine Schnittstelle, über die du Programme mit Befehlen und Argumenten aufrufst. Ausgaben und Exit-Codes können weitere Schritte in einem Script steuern."
    siehe: [Exit-Code]

  - begriff: JSON
    text: "Ein Textformat für strukturierte Daten aus Objekten, Listen und einfachen Werten. Programme können diese Struktur gezielt lesen, statt Informationen aus einer freien Textantwort zu erraten."

  - begriff: Release
    text: "Ein zur Nutzung bereitgestellter Versionsstand einer Software. Ein erfolgreich erzeugter Build bestätigt noch nicht, dass dieser Stand in der Zielumgebung angekommen ist."
    siehe: [Commit, CI]

  - begriff: RAM
    text: "Der Arbeitsspeicher eines Rechners, den laufende Programme für ihre Daten nutzen. Seine freie Kapazität ist von der Kapazität eines separaten Grafikspeichers zu unterscheiden."
    siehe: [VRAM, CPU]

  - begriff: VRAM
    text: "Der Speicher einer Grafikeinheit für Daten ihrer Berechnungen. Bei lokaler Modellinferenz brauchen unter anderem Modellgewichte und der verwendete Kontext Speicher."
    siehe: [RAM, GPU, Quantisierung]

  - begriff: Quantisierung
    text: "Das Darstellen von Modellwerten mit geringerer Genauigkeit oder weniger Bits. Das kann Speicherbedarf senken und die Ergebnisse verändern; die konkrete Variante muss geprüft werden."
    siehe: [VRAM]

  - begriff: CPU-Offloading
    aliase: [Offloading]
    text: "Das Verlagern von Teilen einer Modellberechnung auf die CPU, wenn die Laufzeit dies unterstützt. Die Aufteilung kann Speicherengpässe anders behandeln und die Geschwindigkeit beeinflussen."
    siehe: [CPU, GPU, RAM, VRAM]

  - begriff: GPU
    text: "Ein Prozessor, der viele gleichartige Berechnungen parallel bearbeiten kann. Lokale KI-Laufzeiten können ihn verwenden, wenn Hardware, Modell und Software dazu passen."
    siehe: [CPU, VRAM]

  - begriff: CPU
    text: "Der allgemeine Hauptprozessor eines Rechners. Er führt Programme aus und kann auch Modellberechnungen übernehmen, abhängig von der verwendeten Laufzeit."
    siehe: [GPU, RAM]

  - begriff: RAG
    aliase: [Retrieval-Augmented Generation]
    text: "Ein Verfahren, das für eine Modellantwort zusätzliche Inhalte aus einem zugänglichen Bestand abruft. Welche Dokumente und Ausschnitte gefunden werden, beeinflusst die Antwort. Aktualität und richtige Auswahl der Inhalte müssen gesondert geprüft werden."
    siehe: [Chunk, OCR]

  - begriff: OCR
    text: "Die automatische Erkennung von Text in Bildern oder gescannten Dokumenten. Das Ergebnis kann Zeichen, Reihenfolgen oder Tabellenstrukturen falsch wiedergeben. Für wichtige Aussagen hilft der Vergleich mit dem Original."

  - begriff: Chunk
    aliase: [Chunking]
    text: "Ein Ausschnitt eines größeren Dokuments, der getrennt verarbeitet oder durchsucht wird. Chunking bezeichnet das Aufteilen in solche Ausschnitte. Ihre Grenzen beeinflussen, ob zusammengehörige Informationen gemeinsam gefunden werden."
    siehe: [RAG]

  - begriff: API-Schema
    text: "Eine maschinenlesbare Beschreibung von Daten an einer Schnittstelle. Sie kann etwa Pflichtfelder, Datentypen und erlaubte Werte festlegen. Typen, Prüfungen oder Clients lassen sich daraus ableiten, wenn entsprechende Werkzeuge eingerichtet sind."
    siehe: [API, Datenvertrag, OpenAPI]

  - begriff: OpenAPI
    text: "Ein Format zur maschinenlesbaren Beschreibung von HTTP-Schnittstellen. Es beschreibt unter anderem Operationen, Eingaben und Antworten. Passende Werkzeuge können daraus Dokumentation oder Clients erzeugen."
    siehe: [API, API-Schema]

  - begriff: Laufzeitvalidierung
    text: "Das Prüfen tatsächlich verarbeiteter Daten während der Ausführung eines Programms. Ein Validator kann etwa Pflichtfelder und erlaubte Werte kontrollieren. Welche fachlichen Bedingungen er erkennt, hängt von seinen implementierten Regeln ab."
    siehe: [API-Schema, Datenvertrag]

  - begriff: Typecheck
    text: "Eine Prüfung, ob der untersuchte Code zu den festgelegten Typen passt. Sie kann beispielsweise einen falschen Feldnamen in einem typisierten Aufruf erkennen. Laufzeitdaten und fachlich richtiges Verhalten sind damit nicht vollständig geprüft."
    siehe: [API-Schema, Laufzeitvalidierung]

  - begriff: Trace
    aliase: [Tracing, Agent-Tracing]
    text: "Eine verknüpfte Aufzeichnung beobachteter Schritte eines Ablaufs. Sie kann etwa Modellaufrufe und Werkzeugausführungen verbinden. Ihre Aussagekraft hängt davon ab, welche Teile tatsächlich erfasst und einander zugeordnet wurden."
    siehe: [Instrumentierung, OpenTelemetry]

  - begriff: Instrumentierung
    text: "Das Einrichten von Beobachtungspunkten in einer Software oder ihrer Laufzeit. Sie liefern beispielsweise Ereignisse, Laufzeiten und Ergebnisse für die Fehlersuche. Nicht erfasste Bereiche bleiben auch in einer ausführlichen Auswertung unbeobachtet."
    siehe: [Trace]

  - begriff: OpenTelemetry
    text: "Ein offenes Projekt mit Schnittstellen und Werkzeugen zum Erfassen und Weitergeben von Telemetriedaten. Damit lassen sich unter anderem Beobachtungen aus verschiedenen Prozessen verbinden. Die beteiligten Systeme müssen die benötigten Ereignisse und Zusammenhänge selbst liefern."
    siehe: [Trace, Instrumentierung]

  - begriff: Vibe Coding
    text: "Ein explorativer Entwicklungsstil, bei dem eine Anwendung im Gespräch mit einer KI entsteht. Schnelle sichtbare Ergebnisse helfen beim Ausprobieren von Ideen. Welche Teile bereits zuverlässig funktionieren und welche nur simuliert sind, muss gesondert geprüft werden."

  - begriff: Deep Module
    aliase: [Deep Modules, tiefes Modul]
    text: "Ein Softwarebaustein, der viel nützliches Verhalten hinter einer überschaubaren Schnittstelle anbietet. Seine Benutzer müssen die verborgenen Entscheidungen nicht selbst nachvollziehen. Zur Schnittstelle gehören auch Fehler, Reihenfolgen und andere Regeln der Benutzung."
    siehe: [Information Hiding]

  - begriff: Information Hiding
    text: "Das Bündeln einer Entwurfsentscheidung in dem Baustein, der sie verantwortet. Andere Teile können dessen Fähigkeiten verwenden, ohne diese Entscheidung kennen zu müssen. Private Felder allein gewährleisten diese Trennung noch nicht."
    siehe: [Deep Module]

  - begriff: Bounded Context
    text: "Der Geltungsbereich eines fachlich konsistenten Modells. Innerhalb dieser Grenze sollen Begriffe, Regeln und Operationen dieselbe Bedeutung tragen. Andere Bereiche dürfen eigene Modelle verwenden und müssen ihre Bedeutung bei der Zusammenarbeit passend übersetzen."
    siehe: [Ubiquitous Language, Context Map]

  - begriff: Ubiquitous Language
    text: "Eine gemeinsam verwendete Fachsprache, die das Modell einer Anwendung ausdrückt. Sie umfasst Begriffe, Beziehungen, Regeln und Handlungen in Gesprächen, Code und Tests. Ein Verzeichnis bevorzugter Wörter allein erfüllt diese Aufgabe nicht."
    siehe: [Bounded Context]

  - begriff: Context Map
    text: "Eine Darstellung der tatsächlich vorhandenen Fachmodelle und ihrer Beziehungen. Sie zeigt unter anderem gemeinsame Teile, Übersetzungen und Zuständigkeiten an den Grenzen. Eine gewünschte künftige Struktur muss als solche vom Istzustand unterscheidbar bleiben."
    siehe: [Bounded Context]

  - begriff: Aggregate
    text: "Eine fachlich begründete Gruppe von Objekten, deren Änderungen gemeinsam kontrolliert werden. Sie besitzt einen verantwortlichen Zugang, die Aggregate Root. Ihre Grenze richtet sich nach den zusammen zu schützenden fachlichen Bedingungen."
    siehe: [Aggregate Root, Invariante]

  - begriff: Aggregate Root
    text: "Das verantwortliche Objekt am Zugang eines Aggregates. Es kontrolliert Änderungen und schützt die gemeinsam geltenden fachlichen Bedingungen. Dauerhafte Verweise von außen auf interne Entities werden auf diesen Zugang begrenzt."
    siehe: [Aggregate, Entity]

  - begriff: Entity
    text: "Ein Fachobjekt, dessen Identität über Änderungen seiner Eigenschaften hinweg erhalten bleibt. Welche Kontinuität dabei zählt, bestimmt die Anwendung. Eine Datenbank-ID allein erklärt diese fachliche Bedeutung nicht."

  - begriff: Core Domain
    text: "Der Teil eines Fachmodells, der den besonderen Nutzen eines konkreten Produkts trägt. Er verdient gezielten Wissensaufbau und sorgfältigen Entwurf. Ein technisch anspruchsvoller Bestandteil gehört dadurch noch nicht automatisch zum fachlichen Kern."
    siehe: [Generic Subdomain]

  - begriff: Generic Subdomain
    text: "Ein unterstützender fachlicher Bereich, dessen Fähigkeiten weniger speziell für den besonderen Produktnutzen sind. Er kann durch eine passende vorhandene Lösung oder eine begrenzte eigene Umsetzung abgedeckt werden. Allgemeine Verwendbarkeit auf Vorrat ist dabei kein eigenes Ziel."
    siehe: [Core Domain]

  - begriff: Tracer Bullet
    text: "Ein schmaler funktionierender Durchstich durch den tatsächlichen technischen Ablauf einer Anwendung. Trotz begrenzter Funktionsbreite enthält er bereits angemessene Struktur, Fehlerbehandlung und Prüfungen. Sein Code wird als Gerüst weiterentwickelt."

  - begriff: Design by Contract
    text: "Ein Entwurfsansatz, der Aufruferpflichten, Ergebniszusagen und beständige Eigenschaften ausdrücklich beschreibt. Diese Verträge können durch Typen, Dokumentation, Tests und Laufzeitprüfungen unterstützt werden. Eine richtige Formulierung muss fachlich bestätigt und ihre Umsetzung gesondert geprüft werden."
    siehe: [Invariante, Assertion]

  - begriff: Invariante
    text: "Eine Eigenschaft, die an vereinbarten Grenzen eines Systems gültig bleiben muss. Während eines gekapselten Ablaufs kann vorübergehend ein Zwischenzustand bestehen. Der Entwurf muss festlegen, wann die Eigenschaft wieder gilt und wer ihre Einhaltung kontrolliert."
    siehe: [Design by Contract]

  - begriff: Assertion
    text: "Eine ausdrückliche Aussage über einen erwarteten Zustand. Als Laufzeit-assert prüft sie eine interne Annahme und kann je nach Sprache oder Konfiguration abgeschaltet sein. Normale Eingabeprüfung und notwendige Zustandsänderungen dürfen davon nicht abhängen."
    siehe: [Design by Contract]

  - begriff: Property-Based Testing
    text: "Ein Testverfahren, das erzeugte Eingaben gegen allgemein formulierte Eigenschaften prüft. Es kann Gegenbeispiele finden, die in handgeschriebenen Fällen fehlen. Die gewählte Eigenschaft muss selbst zum gewünschten fachlichen Verhalten passen."
    siehe: [Regressionstest]

  - begriff: DRY
    text: "Ein Entwurfsprinzip gegen unabhängig gepflegte Darstellungen derselben fachlichen Entscheidung. Gleiche Codezeilen können dagegen unterschiedliche Regeln mit eigenen Änderungsgründen ausdrücken. Vor einer Zusammenführung muss deshalb die gemeinsame Bedeutung geklärt werden."

  - begriff: Orthogonalität
    text: "Die möglichst weitgehende Unabhängigkeit verschiedener Entscheidungen und Verantwortungen. Eine Änderung soll andere Bereiche nur dort berühren, wo eine sachliche Abhängigkeit besteht. Versteckter gemeinsamer Zustand erschwert diese Unabhängigkeit."

  - begriff: Coherent incorrectness
    text: "Eine in sich stimmige Umsetzung einer falschen Ausgangsannahme. Derselbe Fehler kann sich durch Datenmodell, Schnittstelle, Oberfläche und Tests ziehen. Ein unabhängig bestätigter Fachfall hilft, die gemeinsame Annahme zu hinterfragen."
