<!--
  RAITEC — caption skin (Untertitel-Look für HyperFrames).

  apply.mjs kopiert diese Datei als .hyperframes/caption-skin.html ins Projekt. Das
  Untertitel-Skript des Workflows (captions.mjs) füllt die reservierten Stellen:
    · das leere GROUPS-Array            → die Wortgruppen mit Zeiten
    · DURATION 0 + width/height 0        → echte Länge und Canvas-Größe
    · der leere data-brand-tokens-Style  → :root-Tokens aus der frame.md des Projekts
  Aus der RAITEC-frame.md ergeben sich: --cap-ink = Navy #05345d (Pill-Fläche),
  --cap-canvas = Weiß (Text), --cap-accent = Orange #f7a824 (aktives Wort),
  --font-display/--font-body = "Titillium Web" (lokal aus assets/fonts).

  Hooks (nicht umbenennen): .caption-group / .caption-word + .is-active / .is-spoken,
  root data-composition-id="captions", Timeline window.__timelines["captions"].
  Zustandswechsel per gsap.set({className}) — seek-sicher; keine tl.call()-Callbacks.

  Look: Navy-Pill mit 12px Radius, keine Schatten. Titillium Web SemiBold, Satzschreibung.
  Kommende Wörter in Slate-60, das gesprochene Wort in Orange, bereits gesprochene in Weiß.
-->
<script src="assets/vendor/gsap.min.js"></script>

<!-- captions.mjs setzt hier die :root-Tokens des Projekts ein -->
<style data-brand-tokens></style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* Untertitel-Band (900–1010px bei 1080p) — Frame-Inhalte bleiben darüber */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* die Navy-Pill — flach, 12px Radius, keine Schatten */
  .caption-pill {
    position: relative;
    max-width: 76%;
    padding: 14px 30px 16px;
    background: var(--cap-ink, #05345d);
    border-radius: 12px;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.08em 0.3em;
    font-family: var(--font-body, "Titillium Web"), Arial, sans-serif;
    font-weight: 600;
    font-size: clamp(32px, 2.05vw, 42px);
    line-height: 1.15;
    letter-spacing: 0;
  }

  /* kommend — Slate-60 */
  .caption-word {
    display: inline-block;
    color: #91a1af;
  }
  /* gesprochen — Orange (der eine Akzent) */
  .caption-word.is-active {
    color: var(--cap-accent, #f7a824);
  }
  /* bereits gesprochen — Weiß */
  .caption-word.is-spoken {
    color: var(--cap-canvas, #ffffff);
  }

  /* optionale Wort-Klassen (nur aktiv, wenn ein Klassifizierer sie setzt) */
  .caption-word.cap-brand {
    font-weight: 700;
  }
  .caption-word.cap-num {
    font-variant-numeric: tabular-nums;
  }
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--cap-accent, #f7a824);
    text-underline-offset: 0.12em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 90%;
    }
    .caption-line {
      font-size: clamp(34px, 4.6vw, 46px);
    }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="0"
  data-fps="30"
  data-width="0"
  data-height="0"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs setzt hier die Wortgruppen und die echte Länge ein.
  var GROUPS = [];
  var DURATION = 0;

  (function () {
    var stage = document.getElementById("caption-stage");

    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start);
        tl.set(el, { className: "caption-word is-active" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt);
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>
