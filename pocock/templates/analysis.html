<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Analyse · Software Factories</title>
<style>
:root{--paper:#f3eee4;--ink:#1c1712;--muted:#746a5f;--accent:#9a4523;--line:#dcd1c0;--pine:#1e3a32}*{box-sizing:border-box}html{scroll-padding-top:5rem}body{margin:0;background:var(--paper);color:var(--ink);font:19px/1.7 Georgia,serif}a{color:var(--accent);text-underline-offset:.2em}a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.bar{border-bottom:1px solid var(--line);background:var(--paper);display:flex;align-items:center;gap:1.6rem;padding:16px max(24px,calc((100vw - 1160px)/2));font:14px/1.5 ui-sans-serif,sans-serif}.bar>a{color:var(--ink);text-decoration:none}.bar .active{color:var(--accent);font-weight:700}.bar form{margin-left:auto}.bar button{color:var(--muted);background:none;border:1px solid var(--line);border-radius:6px;padding:8px 13px;cursor:pointer;font:inherit}
.layout{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:64px;padding:50px 24px 100px}aside{font:13px/1.6 ui-sans-serif,sans-serif;position:sticky;top:24px;align-self:start}aside summary{font-weight:700;color:var(--pine);cursor:pointer;padding:0 0 12px}aside ol{padding-left:18px;margin:0}aside li{margin:0 0 11px}aside a{color:var(--muted);text-decoration:none}aside a:hover{color:var(--accent)}article{min-width:0;overflow-wrap:anywhere}h1,h2,h3,h4{font-weight:600;line-height:1.13;letter-spacing:-.025em}h1{font-size:clamp(36px,4vw,58px);margin:0 0 28px}h2{font-size:34px;margin:2.5em 0 20px;padding-top:20px;border-top:1px solid var(--line)}h3{font-size:27px;margin:2em 0 15px}h4{font-size:23px;margin:1.6em 0 12px}p{margin:0 0 1em}strong{font-weight:700}ul,ol{padding-left:24px}li{margin-bottom:10px}blockquote{border-left:3px solid var(--accent);padding-left:20px;color:var(--muted);margin-left:0}.table-wrap{overflow-x:auto;margin:24px 0;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;font-size:15px;line-height:1.6}th,td{text-align:left;vertical-align:top;padding:11px 14px;border-bottom:1px solid var(--line)}th{color:var(--pine);font-family:ui-sans-serif,sans-serif;font-size:12px}code{font: .82em/1.5 ui-monospace,monospace;background:#eae0d1;padding:.1em .3em;border-radius:4px}pre{background:#1c1712;color:#f5eee3;padding:20px;border-radius:9px;overflow-x:auto;white-space:pre;overflow-wrap:normal}pre code{background:none;padding:0}hr{border:0;border-top:1px solid var(--line);margin:50px 0}
@media(max-width:850px){.layout{grid-template-columns:1fr;gap:30px;padding-top:30px}aside{position:static}h2{font-size:29px}.bar{gap:18px;padding:12px 20px}}@media print{.bar,aside{display:none}.layout{display:block;padding:0}body{background:white;font-size:11pt}h1{font-size:28pt}h2{font-size:20pt}h3{font-size:16pt}}
</style></head><body><nav class="bar" aria-label="Kursbereich"><a href="/">← Zum Kurs</a><a href="/analyse/" class="active" aria-current="page">Analyse</a><form method="post" action="/logout"><button type="submit">Abmelden</button></form></nav>
<div class="layout"><aside><details open><summary>In dieser Analyse</summary><ol>{{TOC}}</ol></details></aside><main><article>{{BODY}}</article></main></div></body></html>
