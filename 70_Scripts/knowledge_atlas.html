function highlighted(value,query){
 const tokens=query.trim().split(/\s+/).filter(Boolean).slice(0,8);

}

 if(type)matches=matches.filter(r=>r.kind===type);

 else if(query)matches.sort((a,b)=>terms.filter(t=>b.titleSearch.includes(t)).length-terms.filter(t=>a.titleSearch.includes(t)).length);
 const pageSize=30,pages=Math.max(1,Math.ceil(matches.length/pageSize)),current=Math.min(page,pages),visible=matches.slice((current-1)*pageSize,current*pageSize);
 const info=view==='search'?{label:'Suchergebnisse',description:query?`Treffer für „${query}“ in Kapiteln, Repositories, Quellen, Patterns und Begriffen.`:'Durchsuche den gesamten Bestand. Kombiniere mehrere Wörter, um die Ergebnisse einzugrenzen.'}:TYPES[view];
 $('breadcrumb').textContent=info.label;
 $('main').innerHTML=`<header class="page-heading"><div class="eyebrow">${view==='search'?'Im gesamten Bestand':view==='saved'?'Dein Arbeitswissen':'Im Bestand nachschlagen'}</div><h1>${view==='search'?'Wissen finden.':escapeHtml(info.label)+'.'}</h1><p>${escapeHtml(info.description)}</p></header>
 ${(view==='search'||view==='saved')?`<div class="tabs" aria-label="Ergebnistyp"><button class="chip ${!type?'active':''}" data-filter="type" data-value="">Alle <small>${Object.values(totals).reduce((a,b)=>a+b,0)}</small></button>${['chapters','repos','sources','patterns','glossary'].map(k=>`<button class="chip ${type===k?'active':''}" data-filter="type" data-value="${k}">${TYPES[k].label}<small>${totals[k]}</small></button>`).join('')}</div>`:''}
 <div class="catalog-tools"><label for="group-filter">Bereich</label><select id="group-filter" aria-label="Bereich filtern"><option value="">Alle Bereiche</option>${groups.map(g=>`<option value="${escapeHtml(g)}" ${selected===g?'selected':''}>${escapeHtml(g)}</option>`).join('')}</select><div class="spacer"></div><label for="sort-filter">Sortierung</label><select id="sort-filter" aria-label="Ergebnisse sortieren"><option value="original" ${sort==='original'?'selected':''}>${query?'Relevanz':'Reihenfolge im Bericht'}</option><option value="az" ${sort==='az'?'selected':''}>Titel A–Z</option><option value="newest" ${sort==='newest'?'selected':''}>Neueste zuerst</option></select></div>
 <div class="result-meta" role="status" aria-live="polite">${matches.length} ${view==='sources'?'Lektüreeinheiten':view==='repos'?'Repositories':view==='patterns'?'Patterns':view==='glossary'?'Begriffe':'Einträge'}${matches.length?` · ${1+(current-1)*pageSize}–${Math.min(current*pageSize,matches.length)} angezeigt`:''}${query?` · Suche: „${escapeHtml(query)}“`:''}</div>
 ${visible.length?`<div class="record-list">${visible.map(r=>recordHtml(r,query)).join('')}</div>`:`<div class="empty">${icon(view==='saved'?'bookmark':'search')}<h2>${view==='saved'&&!query&&!selected&&!type?'Noch nichts gemerkt.':'Keine passenden Einträge.'}</h2><p>${view==='saved'&&!query&&!selected&&!type?'Öffne ein Kapitel oder einen Eintrag und wähle „Merken“.':'Versuche einen anderen Suchbegriff oder setze die Filter zurück.'}</p><a class="button" href="${view==='saved'?'#/chapters':'#/'+view}">${view==='saved'?'Kapitel erkunden':'Filter zurücksetzen'}</a></div>`}
 ${pages>1?`<nav class="pagination" aria-label="Ergebnisseiten"><button class="button" data-page="${current-1}" ${current===1?'disabled':''}>← Zurück</button><span>Seite ${current} von ${pages}</span><button class="button" data-page="${current+1}" ${current===pages?'disabled':''}>Weiter →</button></nav>`:''}${footer()}`;
 $('group-filter').addEventListener('change',e=>setFilter('group',e.target.value));
 $('sort-filter').addEventListener('change',e=>setFilter('sort',e.target.value));
}
function renderReader(record,anchorTarget){
 const chapter=record.kind==='chapters';
 const headings=chapter?record.headings:[];
 const related=record.related||[];
 $('breadcrumb').textContent=chapter?'Wissen verstehen':TYPES[record.kind].label;
 $('main').innerHTML=`<div class="reader-top"><a class="text-link" href="#/${record.kind}">← ${chapter?'Alle Kapitel':TYPES[record.kind].label}</a><div class="reader-actions"><button class="button" id="save" aria-pressed="${saved.has(record.id)}">${icon(saved.has(record.id)?'check':'bookmark')} ${saved.has(record.id)?'Gemerkt':'Merken'}</button><button class="icon-button" id="copy-link" aria-label="Link zum Eintrag kopieren" title="Link zum Eintrag kopieren">${icon('link')}</button><button class="icon-button print-button" id="print" aria-label="Aktuelle Ansicht drucken" title="Aktuelle Ansicht drucken">${icon('print')}</button></div></div>
 <div class="reader-layout"><article><div class="eyebrow">${chapter?`Kapitel ${String(record.number).padStart(2,'0')} / 25`:TYPES[record.kind].singular+(record.code?' · '+record.code:'')}</div><h1 class="reader-title">${escapeHtml(record.title)}</h1><div class="reader-meta"><span>${escapeHtml(record.group)}</span>${record.date?`<span>${record.date.split('-').reverse().join('.')}</span>`:''}${chapter?`<span>ca. ${Math.max(1,Math.ceil(record.text.split(/\s+/).length/220))} Min. Lesezeit</span>`:''}<span>Berichtsstand: 28.10.2026</span></div>
 ${chapter&&[21,22,23,24].includes(record.number)?`<div class="note" style="margin:0 0 25px">${icon('search')}<p>Dieses Register gibt es auch als durchsuchbare Ansicht. <a href="#/${({21:'repos',22:'sources',23:'patterns',24:'glossary'})[record.number]}">Register durchsuchen</a></p></div>`:''}
 <div class="prose">${record.html}</div>
 ${related.length?`<section class="related"><h2>In der Synthese vertiefen</h2><div class="related-links">${related.map(n=>`<a class="chip" href="#/kapitel/${n}">${String(n).padStart(2,'0')} · ${escapeHtml(DATA.chapters[n-1].title)}</a>`).join('')}</div></section>`:''}
 ${chapter?`<nav class="chapter-pagination" aria-label="Kapitel wechseln">${record.number>1?`<a href="#/kapitel/${record.number-1}"><small>← Vorheriges Kapitel</small>${escapeHtml(DATA.chapters[record.number-2].title)}</a>`:''}${record.number<25?`<a href="#/kapitel/${record.number+1}"><small>Nächstes Kapitel →</small>${escapeHtml(DATA.chapters[record.number].title)}</a>`:''}</nav>`:`<div class="related"><a class="text-link" href="#/kapitel/${record.chapter}">Im vollständigen Bericht lesen ${icon('arrow')}</a></div>`}
 </article><aside class="reader-aside" aria-label="Auf dieser Seite"><h2>Auf dieser Seite</h2><nav class="toc">${headings.map(h=>`<a href="#/kapitel/${record.number}?anchor=${encodeURIComponent(h.anchor)}">${escapeHtml(h.title)}</a>`).join('')}</nav><div class="aside-info"><strong>Wissen mit Herkunft</strong>Die Aussagen und Grenzen stammen aus dem Bericht vom 28.10.2026.<br><br><a class="text-link" href="#/kapitel/25">Abdeckung ansehen ${icon('arrow')}</a></div></aside></div>${footer()}`;
 // Originaldateien bleiben neben der internen Wissensnavigation erreichbar.
 for(const link of document.querySelectorAll('.prose a'))if(!link.getAttribute('href').startsWith('#')){link.target='_blank';link.rel='noopener noreferrer';}
 $('save').addEventListener('click',()=>{
  if(saved.has(record.id))saved.delete(record.id);else saved.add(record.id);
  try{localStorage.setItem('company-os-atlas-saved',JSON.stringify([...saved]));}catch{storageAvailable=false;}
  updateSaved();const button=$('save');button.setAttribute('aria-pressed',String(saved.has(record.id)));button.innerHTML=icon(saved.has(record.id)?'check':'bookmark')+' '+(saved.has(record.id)?'Gemerkt':'Merken');
  toast((saved.has(record.id)?'Zur Merkliste hinzugefügt.':'Aus der Merkliste entfernt.')+(!storageAvailable?' Nur für diese Sitzung.':''));
 });
 $('copy-link').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);toast('Link kopiert.');}catch{toast('Link über die Adressleiste des Browsers kopieren.');}});
 $('print').addEventListener('click',()=>window.print());
 if(anchorTarget){const el=document.getElementById(anchorTarget);if(el)el.scrollIntoView({behavior:'instant',block:'start'});}
}
function setFilter(key,value){const r=route();if(value)r.params.set(key,value);else r.params.delete(key);if(key!=='page')r.params.delete('page');location.hash='/'+r.view+(r.params.size?'?'+r.params:'');}
function closeMenu(returnFocus=false){$('sidebar').classList.remove('open');$('overlay').classList.remove('open');$('menu').setAttribute('aria-expanded','false');$('menu').setAttribute('aria-label','Navigation öffnen');if(returnFocus)$('menu').focus();}
function renderPage(focus=false){
 const r=route();const searchValue=r.params.get('q')||'';
 if(document.activeElement!==$('search'))$('search').value=searchValue;
 $('clear-search').hidden=!$('search').value;
 closeMenu();window.scrollTo({top:0,behavior:'instant'});
 if(r.view==='home'){renderHome();navActive('home');}
 else if(r.view==='chapters'){renderChapters(r.params);navActive('chapters');}
 else if(r.view==='kapitel'||r.view==='item'){
  const record=ALL.get(r.view==='kapitel'?'kapitel-'+r.id:r.id);
  if(record){renderReader(record,r.params.get('anchor'));navActive(record.number===25?'coverage':record.kind);}
  else renderMissing();
 }else if(['repos','sources','patterns','glossary','search','saved'].includes(r.view)){renderCatalog(r.view,r.params);navActive(r.view);}
 else renderMissing();
 const h1=$('main').querySelector('h1');document.title=(h1?h1.innerText.replace(/\n/g,' ').replace(/\.$/,''):'Wissensatlas')+' · AI-Company-OS';
 if(focus)$('main').focus({preventScroll:true});
 updateProgress();
}
function renderMissing(){$('breadcrumb').textContent='Nicht gefunden';navActive('');$('main').innerHTML=`<div class="empty">${icon('search')}<h1>Hier liegt kein Eintrag.</h1><p>Der Link ist unvollständig oder gehört zu einem anderen Berichtsstand.</p><a class="button" href="#/home">Zur Übersicht</a></div>${footer()}`;}
function updateProgress(){const isReader=['kapitel','item'].includes(route().view);const range=document.documentElement.scrollHeight-innerHeight;const progress=isReader&&range>0?Math.min(1,window.scrollY/range):0;$('read-progress').style.transform=`scaleX(${progress})`;}
$('navigation').innerHTML=['home','chapters','repos','sources','patterns','glossary'].map(k=>`<a class="nav-link" data-nav="${k}" href="#/${k}">${icon(TYPES[k].icon)}${TYPES[k].label}${k==='home'?'':`<span class="count">${k==='chapters'?25:DATA.counts[k]}</span>`}</a>`).join('');
updateSaved();
function updateThemeLabel(){$('theme').setAttribute('aria-label',document.body.dataset.theme==='dark'?'Helles Farbschema aktivieren':'Dunkles Farbschema aktivieren');}
updateThemeLabel();
$('theme').addEventListener('click',()=>{const dark=document.body.dataset.theme!=='dark';document.body.dataset.theme=dark?'dark':'light';try{localStorage.setItem('company-os-atlas-theme',dark?'dark':'light');}catch{}updateThemeLabel();});
$('download').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([DATA.raw],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=DATA.source;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
$('shortcuts').addEventListener('click',()=>toast('Suche: Strg/⌘ + K oder / · Navigation schließen: Escape'));
$('menu').addEventListener('click',()=>{const open=!$('sidebar').classList.contains('open');$('sidebar').classList.toggle('open',open);$('overlay').classList.toggle('open',open);$('menu').setAttribute('aria-expanded',String(open));$('menu').setAttribute('aria-label',open?'Navigation schließen':'Navigation öffnen');if(open)$('sidebar').querySelector('a').focus();});
$('overlay').addEventListener('click',()=>closeMenu(true));
let searchTimer;
function performSearch(){clearTimeout(searchTimer);const query=$('search').value.trim();const current=route();const params=current.view==='search'?current.params:new URLSearchParams();params.delete('page');if(query)params.set('q',query);else params.delete('q');const destination='#/search'+(params.size?'?'+params:'');if(current.view==='search')history.replaceState(null,'',destination);else history.pushState(null,'',destination);renderPage();}
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);$('clear-search').hidden=!$('search').value;searchTimer=setTimeout(performSearch,100);});
$('search-form').addEventListener('submit',e=>{e.preventDefault();performSearch();});
$('clear-search').addEventListener('click',()=>{$('search').value='';performSearch();$('search').focus();});
document.addEventListener('pointerdown',()=>document.body.classList.remove('keyboard'),true);
document.addEventListener('keydown',e=>{
 document.body.classList.add('keyboard');
 const editable=e.target.closest('input,textarea,[contenteditable=true]');
 if(((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')||(e.key==='/'&&!editable)){e.preventDefault();$('search').focus();$('search').select();}
 if(e.key==='Escape'){if($('sidebar').classList.contains('open'))closeMenu(true);else if(editable){clearTimeout(searchTimer);$('search').value='';performSearch();$('search').blur();}}
 if(e.key==='Tab'&&$('sidebar').classList.contains('open')){const links=[...$('sidebar').querySelectorAll('a,button')];if(e.shiftKey&&document.activeElement===links[0]){e.preventDefault();links[links.length-1].focus();}else if(!e.shiftKey&&document.activeElement===links[links.length-1]){e.preventDefault();links[0].focus();}}
});
document.addEventListener('click',e=>{
 const skip=e.target.closest('a.skip');if(skip){e.preventDefault();$('main').focus();return;}
 const filter=e.target.closest('[data-filter]');if(filter){setFilter(filter.dataset.filter,filter.dataset.value);return;}
 const page=e.target.closest('[data-page]');if(page&&!page.disabled){setFilter('page',page.dataset.page);return;}
 const link=e.target.closest('.prose a');if(!link)return;
 const href=link.getAttribute('href');if(!href)return;
 let target;
 if(href.startsWith('#')){try{target=anchorMap.get(decodeURIComponent(href.slice(1)));}catch{}}
 else if(!/^[a-z]+:/i.test(href)){let key;try{key=decodeURIComponent(href.replace(/^\.\.\//,''));}catch{return;}const id=pathMap.get(key);if(id)target={id};}
 if(target){const current=route();const currentId=current.view==='kapitel'?'kapitel-'+current.id:current.id;if(currentId===target.id&&!target.anchor)return;e.preventDefault();const r=ALL.get(target.id);location.hash=itemHref(r).slice(1)+(target.anchor?'?anchor='+encodeURIComponent(target.anchor):'');}
});
window.addEventListener('hashchange',()=>{clearTimeout(searchTimer);renderPage(true);});
window.addEventListener('scroll',updateProgress,{passive:true});
window.addEventListener('resize',()=>{if(innerWidth>700)closeMenu();updateProgress();});
renderPage();
</script>
</body>
</html>
