# Themen-Taxonomie des Knowledge-Systems
#
# Führende Datei für Themencluster. Sie speist `python 70_Scripts/themen.py`:
#   - `zuordnen`  schlägt beim Ingest Cluster, verwandte Quellen und Patterns vor
#   - `index`     erzeugt die Hub-Notizen unter 80_Knowledge/Themen/ neu
#   - `blog`      liefert ein Briefing (Quellen, Patterns, Keywords, Lücken) für einen Beitrag
#
# Felder je Cluster:
#   name          Anzeigename
#   beschreibung  ein bis zwei Sätze: was gehört hinein, was nicht
#   kern          Begriffe mit Gewicht 3 (trennscharf, kleingeschrieben, Teilstring-Treffer im Volltext)
#   weit          Begriffe mit Gewicht 1 (typisch, aber auch in anderen Clustern zu finden)
#   verwandt      Cluster-IDs, die häufig zusammen behandelt werden
#   blog          Suchbegriffe für Beiträge: hauptkeyword, longtail, fragen
#
# Pflege: neue Begriffe ergänzen, nichts löschen, wenn sie Quellen zugeordnet haben.
# Ein Cluster zerlegen erst, wenn er mehr als etwa 30 Quellen trägt.

cluster:

  kontext:
    name: "Kontext-Management"
    beschreibung: "Was im Kontextfenster steht und wie man es sauber hält: Context Rot, Compact, Clear, Rewind, Handoff zwischen Sessions, Kontextkosten von Tools. Regeldateien gehören zu agent-dateien, die Kosten des Cachings zu modelle-kosten."
    kern: [context rot, context window, kontextfenster, /compact, /clear, /rewind, rewind, autocompact, context pollution, kontext-hygiene, context engineering, handoff, session-hygiene, kontextverschmutzung, context degradation, just-in-time context, frischer kontext, subagents als kontextgrenze]
    weit: [kontext, compaction, session, token, mcp overhead, tool-beschreibungen, scratchpad, gedächtnis, memory]
    verwandt: [agent-dateien, modelle-kosten, orchestrierung, planung]
    blog:
      hauptkeyword: "Context Engineering"
      longtail: ["Context Rot vermeiden", "Claude Code /compact oder /clear", "Claude Code Kontextfenster verwalten", "Session Handoff Dokument", "Rewind statt Korrektur", "Subagents als Kontextgrenze"]
      fragen: ["Wann sollte ich /clear statt /compact nutzen?", "Warum wird mein Agent in langen Sessions schlechter?"]

