# Zuordnung von Sources und Patterns zu Themenclustern (siehe themen.yaml)
#
# Startbestand vom 2026-09-30: Ein Subagent je Notiz-Gruppe hat jede Notiz vollständig gelesen und Cluster,
# Keywords und Kernaussage vorgeschlagen; die Cluster-Namen wurden auf die IDs aus themen.yaml normalisiert.
# Neue Einträge entstehen beim Ingest über `python 70_Scripts/themen.py zuordnen <datei> --uebernehmen`.
#
#   haupt        Cluster-ID mit dem Schwerpunkt der Notiz
#   neben        weitere Cluster-IDs (höchstens zwei)
#   keywords     Suchbegriffe, wie ein Leser sie googeln würde (Fachbegriffe im Original)
#   kernaussage  eine Zeile (nur bei Quellen)
#   synonyme     Alternativbezeichnungen des Konzepts (nur bei Patterns)

